<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>cursor-trail-gallery hero — componentlib</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="ct-hero" id="ctHero">
    <div class="ct-hero__copy">
      <p class="ct-hero__eyebrow">studio.signature</p>
      <h1 class="ct-hero__title">Hover.<br>The work follows.</h1>
      <p class="ct-hero__sub">A trailing strip of recent ink. Move the cursor; click to pin.</p>
    </div>
    <div class="ct-hero__trail" id="ctTrail" aria-hidden="true"></div>
    <p class="ct-hero__hint">move cursor · click anywhere to pin</p>
  </main>
  <script type="module" src="./hero.js"></script>
</body>
</html>
