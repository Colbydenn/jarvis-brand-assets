<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>webgl-particle hero — componentlib</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wp-hero">
    <canvas class="wp-hero__canvas" id="wpCanvas" aria-hidden="true"></canvas>
    <div class="wp-hero__copy">
      <p class="wp-hero__eyebrow">studio.signature</p>
      <h1 class="wp-hero__title">Move first.<br>Then we move with you.</h1>
      <p class="wp-hero__sub">Strength + conditioning for athletes who don't quit early.</p>
      <div class="wp-hero__ctas">
        <a class="wp-cta wp-cta--primary" href="#trial">Start trial</a>
        <a class="wp-cta wp-cta--ghost" href="#schedule">See schedule</a>
      </div>
    </div>
    <p class="wp-hero__hint">Move your cursor — particles will repel.</p>
  </main>
  <script type="module" src="./hero.js"></script>
</body>
</html>
