<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>services-grid — componentlib</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="org-services">
    <header class="org-services__head">
      <p class="org-services__eyebrow">Services</p>
      <h2 class="org-services__title">What we do.</h2>
    </header>
    <ul class="org-services__grid">
      <li class="svc-card">
        <span class="svc-card__num">01</span>
        <h3 class="svc-card__title">Custom blackwork</h3>
        <p class="svc-card__desc">Design + ink, single session or multi-sit.</p>
        <span class="svc-card__meta">From $200/hr</span>
      </li>
      <li class="svc-card">
        <span class="svc-card__num">02</span>
        <h3 class="svc-card__title">Cover-ups & rework</h3>
        <p class="svc-card__desc">Old ink reimagined, scar-friendly.</p>
        <span class="svc-card__meta">Consult required</span>
      </li>
      <li class="svc-card">
        <span class="svc-card__num">03</span>
        <h3 class="svc-card__title">Walk-in flash</h3>
        <p class="svc-card__desc">Curated sheets, no-appointment Saturdays.</p>
        <span class="svc-card__meta">From $80</span>
      </li>
    </ul>
  </section>
</body>
</html>
