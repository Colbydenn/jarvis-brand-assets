<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>contact-block — componentlib</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="org-contact">
    <header class="org-contact__head">
      <p class="org-contact__eyebrow">Find us</p>
      <h2 class="org-contact__title">Walk in. Or book.</h2>
    </header>
    <div class="org-contact__grid">
      <address class="contact-card">
        <h3 class="contact-card__label">Address</h3>
        <p class="contact-card__body">
          2412 Larimer St<br>
          Denver, CO 80205
        </p>
        <a class="contact-card__link" href="https://maps.google.com/?q=2412+Larimer+St+Denver+CO" target="_blank" rel="noopener">Get directions →</a>
      </address>
      <div class="contact-card">
        <h3 class="contact-card__label">Hours</h3>
        <dl class="contact-card__hours">
          <dt>Mon</dt><dd>Closed</dd>
          <dt>Tue–Fri</dt><dd>12:00 – 21:00</dd>
          <dt>Sat</dt><dd>11:00 – 22:00 (walk-ins)</dd>
          <dt>Sun</dt><dd>13:00 – 19:00</dd>
        </dl>
      </div>
      <div class="contact-card">
        <h3 class="contact-card__label">Reach</h3>
        <p class="contact-card__body">
          <a href="tel:+13035551212">+1 (303) 555-1212</a><br>
          <a href="mailto:hi@studio.example">hi@studio.example</a><br>
          <a href="https://instagram.com/studio" target="_blank" rel="noopener">@studio</a>
        </p>
      </div>
    </div>
    <div class="org-contact__map" aria-label="Map placeholder">
      <p>MAP &nbsp;·&nbsp; LARIMER ST &nbsp;·&nbsp; RiNo &nbsp;·&nbsp; DENVER</p>
    </div>
  </section>
</body>
</html>
