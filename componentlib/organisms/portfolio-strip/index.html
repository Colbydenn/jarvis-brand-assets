<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>portfolio-strip — componentlib</title>
  <link rel="stylesheet" href="../../tokens/tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="org-portfolio">
    <header class="org-portfolio__head">
      <p class="org-portfolio__eyebrow">Recent work</p>
      <h2 class="org-portfolio__title">From the chair.</h2>
      <a class="org-portfolio__more" href="#all">View archive →</a>
    </header>
    <div class="org-portfolio__strip" role="list">
      <figure class="pf-tile" role="listitem">
        <div class="pf-tile__img" data-bg="1"></div>
        <figcaption class="pf-tile__cap">Blackwork sleeve · 2026</figcaption>
      </figure>
      <figure class="pf-tile" role="listitem">
        <div class="pf-tile__img" data-bg="2"></div>
        <figcaption class="pf-tile__cap">Fineline floral · 2026</figcaption>
      </figure>
      <figure class="pf-tile" role="listitem">
        <div class="pf-tile__img" data-bg="3"></div>
        <figcaption class="pf-tile__cap">Neo-trad panther · 2025</figcaption>
      </figure>
      <figure class="pf-tile" role="listitem">
        <div class="pf-tile__img" data-bg="4"></div>
        <figcaption class="pf-tile__cap">Geometric back · 2025</figcaption>
      </figure>
      <figure class="pf-tile" role="listitem">
        <div class="pf-tile__img" data-bg="5"></div>
        <figcaption class="pf-tile__cap">Cover-up sleeve · 2025</figcaption>
      </figure>
      <figure class="pf-tile" role="listitem">
        <div class="pf-tile__img" data-bg="6"></div>
        <figcaption class="pf-tile__cap">Script lettering · 2025</figcaption>
      </figure>
    </div>
  </section>
  <script src="./tile-fill.js" type="module"></script>
</body>
</html>
